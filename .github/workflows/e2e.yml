name: E2E Tests - BabyRefil

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permite rodar manualmente no GitHub

# Permissão necessária para fazer deploy (pesostar) no GitHub Pages
permissions:
  contents: write

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar navegadores do Playwright
      run: playwright install --with-deps chromium

    - name: Rodar testes com Pytest
      run: pytest --alluredir=allure-results
      continue-on-error: true # Permite que a pipeline continue mesmo se os testes falharem

    - name: Obter histórico do gh-pages (Útil para gráficos de tendência)
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Gerar HTML do Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history
        keep_reports: 20

    - name: Publicar relatório no GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

    - name: Salvar vídeos e traces do Playwright (Artefato)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-failure-evidences
        path: test-results/
        retention-days: 7
